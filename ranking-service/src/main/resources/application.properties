spring.application.name=ranking-service

server.port=${PORT:8091}



eureka.client.service-url.defaultZone=${EUREKA_URL:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.instance.hostname=${EUREKA_HOSTNAME:localhost}
eureka.instance.instance-id=${spring.application.name}:${server.port}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/esports_arena}
spring.datasource.username=${DB_USUARIO:postgres}
spring.datasource.password=${DB_CLAVE:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:rankings}

jwt.secret=${JWT_SECRETO:clave-secreta-super-segura-para-jwt-esports-arena-manager-2026}
