server:
  port: ${PORT:8080}

eureka:
  client:
    enabled: false

jwt:
  secret: ${JWT_SECRETO:clave-secreta-super-segura-para-jwt-esports-arena-manager-2026}

spring:
  cloud:
    discovery:
      client:
        simple:
          instances:

            user-service:
              - uri: ${USER_SERVICE_URL}

            game-service:
              - uri: ${GAME_SERVICE_URL}

            tournament-service:
              - uri: ${TOURNAMENT_SERVICE_URL}

            team-service:
              - uri: ${TEAM_SERVICE_URL}

            registration-service:
              - uri: ${REGISTRATION_SERVICE_URL}

            sanction-service:
              - uri: ${SANCTION_SERVICE_URL}

            match-service:
              - uri: ${MATCH_SERVICE_URL}

            result-service:
              - uri: ${RESULT_SERVICE_URL}

            ranking-service:
              - uri: ${RANKING_SERVICE_URL}

            prize-service:
              - uri: ${PRIZE_SERVICE_URL}

            auth-service:
              - uri: ${AUTH_SERVICE_URL}