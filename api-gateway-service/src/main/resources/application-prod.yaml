server:
  port: ${PORT:8080}

eureka:
  client:
    enabled: false

jwt:
  secret: ${JWT_SECRETO:clave-secreta-super-segura-para-jwt-esports-arena-manager-2026}

spring:
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: user-service
              uri: ${USER_SERVICE_URL:http://localhost:8087}
              predicates:
                - Path=/api/usuarios/**,/api/v2/usuarios/**

            - id: game-service
              uri: ${GAME_SERVICE_URL:http://localhost:8083}
              predicates:
                - Path=/api/juegos/**,/api/v2/juegos/**

            - id: tournament-service
              uri: ${TOURNAMENT_SERVICE_URL:http://localhost:8084}
              predicates:
                - Path=/api/torneos/**,/api/v2/torneos/**

            - id: team-service
              uri: ${TEAM_SERVICE_URL:http://localhost:8085}
              predicates:
                - Path=/api/equipos/**,/api/v2/equipos/**

            - id: registration-service
              uri: ${REGISTRATION_SERVICE_URL:http://localhost:8086}
              predicates:
                - Path=/api/inscripciones/**,/api/v2/inscripciones/**

            - id: sanction-service
              uri: ${SANCTION_SERVICE_URL:http://localhost:8088}
              predicates:
                - Path=/api/sanciones/**,/api/v2/sanciones/**

            - id: match-service
              uri: ${MATCH_SERVICE_URL:http://localhost:8089}
              predicates:
                - Path=/api/partidas/**,/api/v2/partidas/**

            - id: result-service
              uri: ${RESULT_SERVICE_URL:http://localhost:8090}
              predicates:
                - Path=/api/resultados/**,/api/v2/resultados/**

            - id: ranking-service
              uri: ${RANKING_SERVICE_URL:http://localhost:8091}
              predicates:
                - Path=/api/rankings/**,/api/v2/rankings/**

            - id: prize-service
              uri: ${PRIZE_SERVICE_URL:http://localhost:8092}
              predicates:
                - Path=/api/premios/**,/api/v2/premios/**

            - id: auth-service
              uri: ${AUTH_SERVICE_URL:http://localhost:8093}
              predicates:
                - Path=/api/auth/**